<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkPaddy</title>
    <meta name="description" content="Share links with your inner circle, from any device." />
    <meta name="theme-color" content="#6C5CE7" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon48.png" />
    <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LinkPaddy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the bundle throws before React mounts, say so instead of leaving a blank page.
      window.addEventListener("error", function () {
        var root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;padding:32px;text-align:center;color:#1e1638">' +
            '<h1 style="font-size:20px">LinkPaddy couldn\'t start</h1>' +
            '<p style="color:#5b5675">Check your connection and reload the page.</p>' +
            '<button onclick="location.reload()" style="margin-top:12px;padding:10px 20px;border:0;border-radius:999px;background:#6c5ce7;color:#fff;font-weight:600">Reload</button></div>';
        }
      });
    </script>
  </body>
</html>
